<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Perpustakaan</title>
</head>
<body>

<h1>Manajemen Perpustakaan Sederhana</h1>

<form id="bookForm">
    <input type="hidden" id="bookIndex" value="-1">
    <label for="title">Judul:</label>
    <input type="text" id="title" required>
    <br><br>
    <label for="author">Penulis:</label>
    <input type="text" id="author" required>
    <br><br>
    <label for="year">Tahun Terbit:</label>
    <input type="date" id="year" required>
    <br><br>
    <label for="genre">Genre:</label>
    <input type="text" id="genre" required>
    <br><br>
    <button type="submit">Simpan Buku</button>
</form>

<h2>Daftar Buku</h2>
<table id="bookTable" border="1">
    <thead>
        <tr>
            <th>Judul</th>
            <th>Penulis</th>
            <th>Tahun Terbit</th>
            <th>Genre</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    let books = [];

    document.getElementById('bookForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const title = document.getElementById('title').value;
        const author = document.getElementById('author').value;
        const year = document.getElementById('year').value;
        const genre = document.getElementById('genre').value;
        const index = document.getElementById('bookIndex').value;

        if (index === "-1") {
            // Menambahkan buku baru
            books.push({ title, author, year, genre });
        } else {
            // Mengedit buku yang sudah ada
            books[index] = { title, author, year, genre };
        }

        resetForm();
        renderBooks();
    });

    function renderBooks() {
        const tbody = document.querySelector('#bookTable tbody');
        tbody.innerHTML = '';

        books.forEach((book, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${book.title}</td>
                <td>${book.author}</td>
                <td>${book.year}</td>
                <td>${book.genre}</td>
                <td>
                    <button onclick="editBook(${index})">Edit</button>
                    <button onclick="deleteBook(${index})">Hapus</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function editBook(index) {
        const book = books[index];
        document.getElementById('title').value = book.title;
        document.getElementById('author').value = book.author;
        document.getElementById('year').value = book.year;
        document.getElementById('genre').value = book.genre;
        document.getElementById('bookIndex').value = index;
    }

    function deleteBook(index) {
        books.splice(index, 1);
        renderBooks();
    }

    function resetForm() {
        document.getElementById('bookForm').reset();
        document.getElementById('bookIndex').value = "-1";
    }
</script>

</body>
</html>
